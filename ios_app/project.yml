name: QBeats
options:
  bundleIdPrefix: com.bullfrog

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.20"

targets:
  QBeats:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: QBeats/Info.plist
      properties:
        # DARK-DECL (device 29/07/2026): senza questa chiave gli elementi di sistema
        # (tastiera, pannello Ableton Link) seguono lo stile del device, non l'app —
        # tutta cablata scura. Apple, UIUserInterfaceStyle, iOS 13.0+: "Dark" forza lo
        # stile scuro ignorando l'impostazione di sistema.
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "Q-BEATS uses the local network to connect to Network MIDI sessions on other devices."
        ABLLinkStartStopSyncSupported: true
        ABLLinkPeerName: "Q-BEATS"
        NSBluetoothAlwaysUsageDescription: "Q-BEATS richiede l'accesso al Bluetooth per connettere controller e tastiere MIDI Bluetooth LE."
        NSBluetoothPeripheralUsageDescription: "Q-BEATS richiede l'accesso al Bluetooth per connettere controller e tastiere MIDI Bluetooth LE."
        NSBonjourServices:
          - "_apple-midi._tcp."
          - "_link-peers._tcp"
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: ""
        # Portrait-only su tutti (LIBRO v24) + iPad sempre full-screen: disabilita
        # Slide Over/Split View, che altrimenti forzano il supporto a TUTTE le orientazioni.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
          - Inter-Black.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: Q-BEATS Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.bullfrog.qbeats.backup
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bullfrog.qbeats.backup
            UTTypeDescription: Q-BEATS Backup
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - qbeats
    dependencies:
      - package: ZIPFoundation
    frameworks:
      - CoreAudio.framework
      - CoreMIDI.framework
      - AVFoundation.framework
      - CoreAudioKit.framework
      # === MODIFICATO 6A ===
      - path: ../Vendors/AbletonLink/LinkKit.xcframework
    resources:
      - path: ../Vendors/AbletonLink/LinkKitResources.bundle
        codeSignOnCopy: true
    entitlements:
      path: QBeats/QBeats.entitlements
      properties:
        # iCloud entitlements rimosse temporaneamente per sbloccare TD #44:
        # exportArchive falliva perché QBeats_Dev_Profile su Apple Developer
        # Portal non ha la capability iCloud abilitata. Q-BEATS ha fallback
        # automatico a Documents locale in QBeatsStore.swift:130-134, quindi
        # l'app funziona senza iCloud (solo sync cross-device disabilitato).
        # Ri-aggiungere quando la capability iCloud sarà abilitata nel profile.
        com.apple.developer.networking.multicast: true
        get-task-allow: true
    sources:
      - path: QBeats
      - path: ../core_engine
        name: CoreEngine
        excludes:
          - "CMakeLists.txt"
          - "tests/**"
          - "test_main.cpp"
      - path: QBeats/test_backtrack.mp3
        buildPhase: resources
        group: TestAssets
        compilerFlags: ""
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bullfrog.qbeats
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: QBeats_Dev_Profile
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core_engine"
          - "$(SRCROOT)/../Vendors/AbletonLink/LinkKit.xcframework/ios-arm64/Headers"
          - "$(SRCROOT)/../Vendors/AbletonLink/LinkKit.xcframework/ios-arm64_x86_64-simulator/Headers"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../Vendors/AbletonLink"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/../Vendors/AbletonLink/LinkKit.xcframework/ios-arm64"
          - "-lLinkKit"
        SWIFT_OBJC_BRIDGING_HEADER: "QBeats/QBeats-Bridging-Header.h"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
          EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]: ""
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "test_backtrack.mp3"

  # === B7-A5-pre — Banco Swift (infra, ratifica referee 03/07/2026) ===
  # Target unit-test STANDALONE (D1): nessuna host app, nessuna dependency
  # sull'app — compila direttamente QBeats/Models (cartella auto-contenuta,
  # solo Foundation/Combine) + i file di test. NIENTE LinkKit/core_engine/
  # bridging: il banco testa i modelli Codable, isolato da firma e C++.
  QBeatsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: QBeatsTests
      - path: QBeats/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bullfrog.qbeats.tests
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""

# Scheme ESPLICITO per il banco (D1: xcodebuild test -scheme esige uno scheme
# condiviso; non affidiamo il banco all'auto-generazione).
schemes:
  QBeatsTests:
    build:
      targets:
        QBeatsTests: test
    test:
      config: Debug
      targets:
        - QBeatsTests
