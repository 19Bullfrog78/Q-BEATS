name: iOS Signed Build
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios_app
        run: xcodegen generate
      - name: Install Apple Certificate
        env:
          P12_CERTIFICATE: ${{ secrets.P12_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="temp_keychain_password"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$P12_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/QBeats_Dev_Profile.mobileprovision
      - name: Build and Archive
        working-directory: ios_app
        run: |
          xcodebuild \
            -project QBeats.xcodeproj \
            -scheme QBeats \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/QBeats.xcarchive \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM=X42CX3ZP3T \
            archive
      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>X42CX3ZP3T</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bullfrog.qbeats</key>
              <string>QBeats_Dev_Profile</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Manual codesign with entitlements
        run: |
          codesign --force --sign "Apple Development: Mauro Martintoni (AZ8V772X7R)" \
            --entitlements $GITHUB_WORKSPACE/ios_app/QBeats/QBeats.entitlements \
            --timestamp=none \
            $RUNNER_TEMP/QBeats.xcarchive/Products/Applications/QBeats.app
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/QBeats.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist
      - name: Verify entitlements in exported IPA
        run: |
          cd $RUNNER_TEMP/ipa
          IPA_FILE=$(ls *.ipa | head -1)
          mkdir verify-extract
          unzip -q "$IPA_FILE" -d verify-extract
          APP_PATH=$(ls -d verify-extract/Payload/*.app | head -1)
          echo "=== Entitlements finali nel binary IPA (dump raw) ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 || true
          echo ""
          echo "=== Sanity check TD #44 (multicast entitlement) ==="
          if codesign -d --entitlements - "$APP_PATH" 2>&1 | grep -q "com.apple.developer.networking.multicast"; then
            echo "✅ com.apple.developer.networking.multicast presente nel binary IPA"
          else
            echo "❌ com.apple.developer.networking.multicast MANCANTE nel binary IPA — regressione TD #44"
            exit 1
          fi
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBeats-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
