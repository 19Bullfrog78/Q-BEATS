name: F1 — Build Check (zero errors, zero warnings)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A405 — PASSO DI SOLA LETTURA, TEMPORANEO (mandato DUE-ERRORI-P1 §3 c): dove l'SDK di iOS della CI dichiara
      # l'attivazione asincrona di AVAudioSession. Non scrive niente; al cancello non c'è più.
      - name: A405 sola lettura - AVAudioSession nell'SDK
        continue-on-error: true
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          xcrun --sdk iphoneos --show-sdk-version
          find "$SDK/System/Library/Frameworks/AVFAudio.framework" -name 'AVAudioSession*.h' | sort
          for H in $(find "$SDK/System/Library/Frameworks/AVFAudio.framework" -name 'AVAudioSession*.h' | sort); do
            echo "=== $H"
            grep -n 'activateWithOptions\|activateWithCompletionHandler\|deactivateWithCompletionHandler\|setActive:' "$H" || true
          done
          for H in $(grep -l 'activateWithOptions' $(find "$SDK/System/Library/Frameworks/AVFAudio.framework" -name 'AVAudioSession*.h')); do
            echo "=== CONTESTO $H"
            for N in $(grep -n 'activateWithOptions\|activateWithCompletionHandler\|deactivateWithCompletionHandler' "$H" | cut -d: -f1); do
              S=$((N > 40 ? N - 40 : 1)); E=$((N + 6))
              echo "--- righe $S-$E"
              sed -n "${S},${E}p" "$H" | nl -ba -v "$S"
            done
          done
          SI="$(find "$SDK" -path '*AVFAudio.swiftmodule*' -name '*.swiftinterface' | head -1)"
          echo "swiftinterface: $SI"
          if [ -n "$SI" ]; then grep -n 'func activate(\|func deactivate(' "$SI" | head -20 || true; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # LinkKit non sta nel deposito (licenza Ableton Link SDK): lo scarica
      # lo script dalla release ufficiale e ne controlla lo sha256.
      - name: Fetch LinkKit (Ableton Link SDK)
        run: bash .github/scripts/fetch_linkkit.sh

      - name: Generate Xcode project
        working-directory: ios_app
        run: xcodegen generate

      - name: Build Debug (no signing)
        working-directory: ios_app
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project QBeats.xcodeproj \
            -scheme QBeats \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            2>&1 | tee ../build_output.txt

      - name: Check errors and warnings
        run: |
          WARNINGS=$(grep ': warning:' build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          ERRORS=$(grep ': error:' build_output.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "=== F1 BUILD SUMMARY ==="
          echo "Errors:   $ERRORS"
          echo "Warnings: $WARNINGS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "--- ERRORS ---"
            grep ': error:' build_output.txt || true
            echo "❌ F1 FAIL — $ERRORS errori"
            exit 1
          fi
          if [ "$WARNINGS" -gt 0 ]; then
            echo "--- WARNINGS ---"
            grep ': warning:' build_output.txt || true
            echo "⚠️  F1 WARNING — $WARNINGS warning nuovi"
            exit 1
          fi
          echo "✅ F1 PASS — zero errori, zero warning"
